[project]
name = "meqyas-api"
version = "1.0.0"
description = "MEQYAS AI — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "meqyas-ai",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "email-validator>=2.2",
  "httpx>=0.27",
  "redis>=5.2",
  "arq>=0.26",
  "cryptography>=43",
  "segno>=1.6",
  "numpy>=2.1",
  "scipy>=1.14",
  "openpyxl>=3.1",
  "python-multipart>=0.0.17",
  "tzdata>=2024.2",
]

[tool.uv.sources]
meqyas-ai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
