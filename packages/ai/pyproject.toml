[project]
name = "meqyas-ai"
version = "1.0.0"
description = "MEQYAS AI — AI provider abstraction, measurement domain rules and agents"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "openai>=1.54",
  "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meqyas_ai"]
